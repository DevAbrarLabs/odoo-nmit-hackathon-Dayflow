<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaHR Demo</title><style>
:root{--bg:#07111f;--panel:#101d30;--panel2:#15253b;--line:#263950;--text:#eef5ff;--muted:#9db0c8;--blue:#6c8cff;--cyan:#38d7ca;--bad:#ff7685;--good:#49d69b}*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,Segoe UI,sans-serif;background:radial-gradient(circle at 15% 0,#172c50 0,transparent 35%),var(--bg);color:var(--text)}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%);background:#0d1929e8;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 30px 80px #0008}.brand{display:flex;gap:12px;align-items:center;font-size:21px;font-weight:800}.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#06111d}.login h1{font-size:30px;margin:30px 0 6px}.muted{color:var(--muted)}label{display:block;margin:18px 0 7px;color:#c5d3e5;font-weight:600}input,select{width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:#091522;color:var(--text);outline:none}input:focus,select:focus{border-color:var(--blue)}button{cursor:pointer;border:0;border-radius:11px;padding:11px 16px;font-weight:700}.primary{background:linear-gradient(135deg,var(--blue),#586cdb);color:white}.wide{width:100%;margin-top:22px}.error{margin-top:13px;color:var(--bad);min-height:20px}.hint{margin-top:24px;padding:14px;background:#142238;border-radius:12px;color:var(--muted);font-size:12px}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.side{background:#0b1726dd;border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column;gap:28px}.nav{display:grid;gap:7px}.nav button{background:transparent;color:var(--muted);text-align:left}.nav button:hover,.nav button.active{background:#192a43;color:white}.spacer{flex:1}.user{padding:13px;border-radius:13px;background:#13233a}.user small{display:block;color:var(--muted)}main{padding:32px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:27px}.pill{padding:7px 11px;border-radius:99px;background:#173a39;color:#7af1cf}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:linear-gradient(145deg,#111f33,#0d1929);border:1px solid var(--line);border-radius:17px;padding:20px}.stat strong{display:block;font-size:27px;margin-top:9px}.section{margin-top:18px}.section h2{margin:0 0 16px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.action{background:#14243a;border:1px solid var(--line);color:white;text-align:left;padding:18px}.action span{display:block;color:var(--muted);font-weight:400;margin-top:5px}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px;text-transform:uppercase}.status{font-size:12px;padding:4px 8px;border-radius:99px;background:#173a39;color:#7af1cf}.status.warn{background:#41361b;color:#ffd77a}.status.bad{background:#41242a;color:#ff9ca6}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{max-width:300px}.secondary{background:#20324c;color:white}.danger{background:#46242c;color:#ffbdc3}.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px}.dialog{width:min(560px,100%);background:#101d30;border:1px solid var(--line);border-radius:19px;padding:24px}.dialog h2{margin-top:0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{background:#0a1625;padding:13px;border-radius:11px;margin-top:14px;color:var(--muted)}.checks div{margin:4px 0}.ok{color:var(--good)}.badtext{color:var(--bad)}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;right:24px;bottom:24px;background:#143d35;border:1px solid #317460;padding:13px 18px;border-radius:12px}.empty{text-align:center;color:var(--muted);padding:35px}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:static;border-right:0}.nav{grid-template-columns:repeat(5,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr}}@media(max-width:560px){main{padding:20px}.grid,.cols{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}.toolbar{flex-direction:column}table{font-size:12px}.card{overflow:auto}}
</style></head><body>
<style>body.admin-mode{--blue:#aa78ff;--cyan:#ffbd62;background:radial-gradient(circle at 15% 0,#38245d 0,transparent 38%),#090b18}body.admin-mode .side{background:#110e23ee}body.admin-mode .logo{background:linear-gradient(135deg,#a572ff,#ffae62)}body.admin-mode .pill{background:#362650;color:#d9bdff}.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}.approve{background:#164435;color:#83f2bd}.reject{background:#48252c;color:#ffabb4}.split{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}@media(max-width:800px){.split{grid-template-columns:1fr}}</style>
<section id="login" class="login"><div class="login-card"><div class="brand"><div class="logo">N</div>NovaHR</div><h1>Welcome back</h1><div class="muted">Sign in to your people novahr</div><label>Role</label><select id="role"><option>Employee</option><option>HR</option><option>Admin</option></select><label>Email</label><input id="email" value="admin@novahr.demo"><label>Password</label><input id="password" type="password" value="Admin@123"><div id="pinWrap" class="hidden"><label>Admin PIN</label><input id="pin" type="password" value="4826" maxlength="6"></div><button id="loginBtn" class="primary wide">Sign in</button><div id="loginError" class="error"></div><div class="hint">Admin demo: admin@novahr.demo · Admin@123 · PIN 4826<br>Use Reset sample database after signing in to restore all demo data.</div></div></section>
<section id="app" class="app hidden"><aside class="side"><div class="brand"><div class="logo">N</div><span id="brandName">NovaHR</span></div><nav class="nav"><button data-page="home" class="active">⌂ Home</button><button data-page="attendance">◷ Attendance</button><button data-page="leave">▣ My leave</button><button data-page="holidays" id="holidayNav">✓ Holiday approvals</button><button data-page="payroll">₹ Payroll</button><button data-page="admin" id="adminNav">⚙ Admin</button></nav><div class="spacer"></div><div id="userCard" class="user"></div><button id="reset" class="secondary">Reset sample database</button><button id="logout" class="danger">Sign out</button></aside><main><div class="top"><div><h1 id="title">Home</h1><div id="subtitle" class="muted"></div></div><span id="rolePill" class="pill"></span></div><div id="content"></div></main></section>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const USERS=[
{id:'EMP001',name:'Aarav Mehta',email:'employee@novahr.demo',password:'Employee@123',role:'Employee',salary:72000},{id:'EMP002',name:'Riya Sharma',email:'riya@novahr.demo',password:'Riya@1234',role:'Employee',salary:68000},{id:'EMP003',name:'Kabir Rao',email:'kabir@novahr.demo',password:'Kabir@1234',role:'Employee',salary:75500},{id:'EMP004',name:'Ananya Iyer',email:'ananya@novahr.demo',password:'Ananya@123',role:'Employee',salary:81000},{id:'EMP005',name:'Vihaan Nair',email:'vihaan@novahr.demo',password:'Vihaan@123',role:'Employee',salary:64500},{id:'HR001',name:'Neha Kapoor',email:'hr@novahr.demo',password:'HR@123456',role:'HR',salary:93000},{id:'HR002',name:'Arjun Menon',email:'arjun.hr@novahr.demo',password:'ArjunHR@123',role:'HR',salary:88500},{id:'ADM001',name:'Meera Singh',email:'admin@novahr.demo',password:'Admin@123',pin:'4826',role:'Admin',salary:125000},{id:'ADM002',name:'Dev Malhotra',email:'dev.admin@novahr.demo',password:'DevAdmin@123',pin:'7319',role:'Admin',salary:118000}];
const KEY='novahr.demo.v3';let current=null,page='home';const HOLIDAYS=[{id:'H1',employeeId:'EMP001',from:'2026-09-03',to:'2026-09-05',type:'Annual leave',reason:'Family celebration',status:'Pending'},{id:'H2',employeeId:'EMP002',from:'2026-08-28',to:'2026-08-28',type:'Personal leave',reason:'Appointment',status:'Pending'},{id:'H3',employeeId:'EMP003',from:'2026-09-12',to:'2026-09-16',type:'Annual leave',reason:'Travel',status:'Approved'},{id:'H4',employeeId:'EMP004',from:'2026-08-25',to:'2026-08-26',type:'Sick leave',reason:'Recovery',status:'Pending'},{id:'H5',employeeId:'HR001',from:'2026-09-20',to:'2026-09-21',type:'Personal leave',reason:'Family commitment',status:'Rejected'}];
function seed(){let attendance=[],payroll=[],leave=[];USERS.forEach((u,ui)=>{for(let d=1;d<=5;d++)attendance.push({id:`A${ui+1}${d}`,employeeId:u.id,date:`2026-08-${String(10+d).padStart(2,'0')}`,status:(d===4&&ui%3===0)?'Absent':'Present',approval:'Approved'});payroll.push({id:'P'+(ui+1),employeeId:u.id,month:'2026-08',basic:u.salary,hra:Math.round(u.salary*.2),allowances:Math.round(u.salary*.08),deductions:Math.round(u.salary*.05),updatedAt:'2026-08-01T09:00:00Z',updatedBy:'System'});if(ui<6)leave.push({id:'L'+(ui+1),employeeId:u.id,reason:['Family event','Medical appointment','Personal work'][ui%3],status:ui%2?'Pending':'Approved'});});return{users:USERS,attendance,payroll,leave,holidays:HOLIDAYS,version:5}}
function db(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x?.version===3){x.holidays=HOLIDAYS;x.version=4;save(x);return x}if(x?.version===4){x.version=5;save(x);return x}if(x?.version===5)return x}catch{}let x=seed();localStorage.setItem(KEY,JSON.stringify(x));return x}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n)}function total(p){return p.basic+p.hra+p.allowances-p.deductions}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
role.onchange=()=>pinWrap.classList.toggle('hidden',role.value!=='Admin');role.onchange();loginBtn.onclick=()=>{let u=db().users.find(x=>x.email.toLowerCase()===email.value.trim().toLowerCase());let err=!u?'Account not found.':u.password!==password.value?'Incorrect password.':u.role!==role.value?`This account is registered as ${u.role}.`:u.role==='Admin'&&u.pin!==pin.value?'Incorrect admin PIN.':'';loginError.textContent=err;if(err)return;current=u;login.classList.add('hidden');app.classList.remove('hidden');adminNav.classList.toggle('hidden',u.role!=='Admin');holidayNav.classList.toggle('hidden',u.role!=='Admin');document.body.classList.toggle('admin-mode',u.role==='Admin');brandName.textContent=u.role==='Admin'?'NovaHR Command':'NovaHR';userCard.innerHTML=`<strong>${esc(u.name)}</strong><small>${u.id} · ${u.role}</small>`;rolePill.textContent=u.role;updateLeaveBadge();show('home')};logout.onclick=()=>{current=null;document.body.classList.remove('admin-mode');app.classList.add('hidden');login.classList.remove('hidden')};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));function updateLeaveBadge(){if(!current||current.role!=='Admin')return;let n=db().holidays.filter(h=>h.status==='Pending').length;holidayNav.textContent=`🔔 Leave approvals${n?' ('+n+')':''}`}reset.onclick=()=>{if(confirm('Restore the original NovaHR sample data?')){save(seed());toastMsg('Sample database restored');show(page)}};
function show(p){if(['admin','holidays'].includes(p)&&current.role!=='Admin')return;page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));title.textContent={home:current.role==='Admin'?'Admin command center':'My novahr',attendance:'Attendance',leave:'My leave',holidays:'Holiday approvals',payroll:'Payroll',admin:'Administration'}[p];subtitle.textContent=p==='home'?(current.role==='Admin'?'Workforce operations and approvals at a glance':`Good to see you, ${current.name.split(' ')[0]}.`):'NovaHR sample novahr';({home:homePage,attendance:attendancePage,leave:leavePage,holidays:holidaysPage,payroll:payrollPage,admin:adminPage}[p])()}
function homePage(){let x=db();if(current.role==='Admin'){let pending=x.holidays.filter(h=>h.status==='Pending').length;content.innerHTML=`<div class="eyebrow">Administrator novahr</div><div class="grid"><div class="card stat"><span class="muted">People</span><strong>${x.users.length}</strong></div><div class="card stat"><span class="muted">Pending leave alerts</span><strong>${pending}</strong></div><div class="card stat"><span class="muted">Monthly payroll</span><strong>${money(x.payroll.reduce((n,p)=>n+total(p),0))}</strong></div><div class="card stat"><span class="muted">Payroll accuracy</span><strong>${validateAll(x).length?'Review':'100%'}</strong></div></div><div class="split section"><div class="card"><h2>Approval queue</h2><p class="muted">Employees have submitted leave requests that need your approval or denial.</p><button class="primary" onclick="show('holidays')">Open ${pending} leave notifications</button></div><div class="card"><h2>Admin tools</h2><button class="action wide" onclick="show('payroll')">Manage payroll<span>View and update all salaries</span></button></div></div>`;return}let mine=x.attendance.filter(a=>a.employeeId===current.id),pay=x.payroll.find(p=>p.employeeId===current.id),holiday=x.holidays.filter(h=>h.employeeId===current.id);content.innerHTML=`<div class="eyebrow">Employee novahr</div><div class="grid"><div class="card stat"><span class="muted">My attendance</span><strong>${Math.round(mine.filter(a=>a.status==='Present').length/Math.max(1,mine.length)*100)}%</strong></div><div class="card stat"><span class="muted">My leave requests</span><strong>${holiday.length}</strong></div><div class="card stat"><span class="muted">My net payroll</span><strong>${pay?money(total(pay)):'—'}</strong></div><div class="card stat"><span class="muted">Profile status</span><strong>Active</strong></div></div><div class="card section"><h2>My quick actions</h2><div class="actions"><button class="action" onclick="show('attendance')">My attendance<span>Review your recent records</span></button><button class="action" onclick="show('leave')">My leave<span>Track holiday requests</span></button><button class="action" onclick="show('payroll')">My payslip<span>See your salary breakdown</span></button></div></div>`}
function rows(items,fn){return items.length?items.map(fn).join(''):`<tr><td class="empty" colspan="8">No records found</td></tr>`}function attendancePage(){let x=db(),a=current.role==='Admin'?x.attendance:x.attendance.filter(v=>v.employeeId===current.id);content.innerHTML=`<div class="card"><table><thead><tr><th>Employee</th><th>Date</th><th>Status</th><th>Approval</th></tr></thead><tbody>${rows(a,(v)=>`<tr><td>${v.employeeId}</td><td>${v.date}</td><td>${v.status}</td><td><span class="status">${v.approval}</span></td></tr>`)}</tbody></table></div>`}function leavePage(){let x=db(),a=x.holidays.filter(v=>v.employeeId===current.id);content.innerHTML=`<div class="split"><div class="card"><h2>Apply for leave</h2><p class="muted">Your manager will be notified as soon as you submit.</p><div class="cols"><div><label>From</label><input id="leaveFrom" type="date"></div><div><label>To</label><input id="leaveTo" type="date"></div><div><label>Leave type</label><select id="leaveType"><option>Annual leave</option><option>Sick leave</option><option>Personal leave</option></select></div></div><label>Reason</label><input id="leaveReason" maxlength="120" placeholder="Brief reason for your request"><div id="leaveError" class="error"></div><button class="primary" onclick="submitLeave()">Submit leave request</button></div><div class="card"><h2>What happens next?</h2><p class="muted">1. Your request is marked pending.<br><br>2. Admin receives a new notification.<br><br>3. You see the approve or deny decision here.</p></div></div><div class="card section"><h2>My leave requests</h2><table><thead><tr><th>Dates</th><th>Type</th><th>Reason</th><th>Status</th><th>Reviewed by</th></tr></thead><tbody>${rows([...a].reverse(),h=>`<tr><td>${h.from}${h.to!==h.from?' → '+h.to:''}</td><td>${esc(h.type)}</td><td>${esc(h.reason)}</td><td><span class="status ${h.status==='Pending'?'warn':h.status==='Rejected'?'bad':''}">${h.status}</span></td><td>${esc(h.reviewedBy||'Awaiting review')}</td></tr>`)}</tbody></table></div>`}function submitLeave(){if(current.role==='Admin')return;let from=leaveFrom.value,to=leaveTo.value,type=leaveType.value,reason=leaveReason.value.trim(),errors=[];if(!from||!to)errors.push('Choose both leave dates.');if(from&&to&&to<from)errors.push('End date cannot be before start date.');if(!reason)errors.push('Add a reason for your request.');if(errors.length){leaveError.textContent=errors.join(' ');return}let x=db();x.holidays.push({id:'H'+Date.now(),employeeId:current.id,from,to,type,reason,status:'Pending',submittedAt:new Date().toISOString()});save(x);toastMsg('Leave submitted — admin notified');leavePage()}
function holidaysPage(){if(current.role!=='Admin')return;let x=db(),a=[...x.holidays].sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1));content.innerHTML=`<div class="toolbar"><span class="pill">🔔 ${a.filter(h=>h.status==='Pending').length} new leave notifications</span></div><div class="card"><table><thead><tr><th>Employee</th><th>Dates</th><th>Type</th><th>Reason</th><th>Status</th><th>Decision</th></tr></thead><tbody>${rows(a,h=>{let u=x.users.find(v=>v.id===h.employeeId);return `<tr><td><strong>${esc(u?.name||h.employeeId)}</strong><div class="muted">${h.employeeId}</div></td><td>${h.from}${h.to!==h.from?' → '+h.to:''}</td><td>${esc(h.type)}</td><td>${esc(h.reason)}</td><td><span class="status ${h.status==='Pending'?'warn':h.status==='Rejected'?'bad':''}">${h.status}</span></td><td>${h.status==='Pending'?`<button class="approve" onclick="decideHoliday('${h.id}','Approved')">Approve</button> <button class="reject" onclick="decideHoliday('${h.id}','Rejected')">Reject</button>`:`<span class="muted">Reviewed</span>`}</td></tr>`})}</tbody></table></div>`}function decideHoliday(id,status){if(current.role!=='Admin')return;let x=db(),h=x.holidays.find(v=>v.id===id);if(!h)return;h.status=status;h.reviewedBy=current.name;h.reviewedAt=new Date().toISOString();save(x);updateLeaveBadge();toastMsg(`Leave request ${status==='Approved'?'approved':'denied'}`);holidaysPage()}
function payrollPage(){let x=db();if(current.role!=='Admin'){let p=x.payroll.find(v=>v.employeeId===current.id);content.innerHTML=p?payCard(p):'<div class="card empty">No payroll record</div>';return}content.innerHTML=`<div class="toolbar"><input id="search" placeholder="Search employee or ID"><button class="secondary" onclick="audit()">Run accuracy audit</button></div><div class="card"><table><thead><tr><th>Employee</th><th>Month</th><th>Basic</th><th>HRA</th><th>Allowances</th><th>Deductions</th><th>Net</th><th></th></tr></thead><tbody id="payRows">${payRows(x.payroll)}</tbody></table></div>`;search.oninput=()=>{let q=search.value.toLowerCase(),d=db();payRows.innerHTML=payRows(d.payroll.filter(p=>{let u=d.users.find(v=>v.id===p.employeeId);return(`${p.employeeId} ${u?.name}`).toLowerCase().includes(q)}))}}
function payRows(a){let x=db();return rows(a,p=>{let u=x.users.find(v=>v.id===p.employeeId);return`<tr><td><strong>${esc(u?.name||p.employeeId)}</strong><div class="muted">${p.employeeId}</div></td><td>${p.month}</td><td>${money(p.basic)}</td><td>${money(p.hra)}</td><td>${money(p.allowances)}</td><td>${money(p.deductions)}</td><td><strong>${money(total(p))}</strong></td><td><button class="secondary" onclick="editPay('${p.employeeId}')">Edit</button></td></tr>`})}function payCard(p){return`<div class="card"><h2>${p.month} salary breakdown</h2><table><tr><td>Basic salary</td><td>${money(p.basic)}</td></tr><tr><td>House rent allowance</td><td>${money(p.hra)}</td></tr><tr><td>Other allowances</td><td>${money(p.allowances)}</td></tr><tr><td>Deductions</td><td>− ${money(p.deductions)}</td></tr><tr><th>Net salary</th><th>${money(total(p))}</th></tr></table><p class="muted">Last updated by ${esc(p.updatedBy)} · ${new Date(p.updatedAt).toLocaleString()}</p></div>`}
function adminPage(){let x=db();content.innerHTML=`<div class="grid"><div class="card stat"><span class="muted">People</span><strong>${x.users.length}</strong></div><div class="card stat"><span class="muted">Payroll records</span><strong>${x.payroll.length}</strong></div><div class="card stat"><span class="muted">Monthly net payroll</span><strong>${money(x.payroll.reduce((s,p)=>s+total(p),0))}</strong></div><div class="card stat"><span class="muted">Accuracy</span><strong>${validateAll(x).length?'Review':'100%'}</strong></div></div><div class="card section"><h2>Payroll management</h2><p class="muted">Only administrators can view all salaries or change salary structures. Every update is validated, timestamped, and attributed.</p><button class="primary" onclick="show('payroll')">Manage all payroll</button></div>`}
function validate(p,x=db()){let e=[];for(let k of ['basic','hra','allowances','deductions'])if(!Number.isFinite(p[k])||p[k]<0)e.push(`${k} must be a non-negative number`);if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(p.month))e.push('month must use YYYY-MM');if(p.basic<10000||p.basic>1000000)e.push('basic salary must be between ₹10,000 and ₹10,00,000');if(p.hra>p.basic)e.push('HRA cannot exceed basic salary');if(p.allowances>p.basic)e.push('allowances cannot exceed basic salary');if(p.deductions>p.basic+p.hra+p.allowances)e.push('deductions cannot exceed gross salary');if(!x.users.some(u=>u.id===p.employeeId))e.push('employee does not exist');return e}function validateAll(x){return x.payroll.flatMap(p=>validate(p,x).map(e=>`${p.employeeId}: ${e}`))}
function editPay(id){if(current.role!=='Admin')return;let x=db(),p=x.payroll.find(v=>v.employeeId===id),u=x.users.find(v=>v.id===id);modal.classList.remove('hidden');modal.innerHTML=`<div class="dialog"><h2>Update salary structure</h2><div class="muted">${esc(u.name)} · ${id}</div><div class="cols"><div><label>Payroll month</label><input id="m" value="${p.month}"></div><div><label>Basic salary</label><input id="b" type="number" min="10000" value="${p.basic}"></div><div><label>HRA</label><input id="h" type="number" min="0" value="${p.hra}"></div><div><label>Allowances</label><input id="a" type="number" min="0" value="${p.allowances}"></div><div><label>Deductions</label><input id="d" type="number" min="0" value="${p.deductions}"></div></div><div id="checks" class="checks"></div><div class="dialog-actions"><button class="secondary" onclick="closeModal()">Cancel</button><button id="savePay" class="primary">Validate & save</button></div></div>`;function preview(){let q={employeeId:id,month:m.value,basic:+b.value,hra:+h.value,allowances:+a.value,deductions:+d.value},errs=validate(q,x);checks.innerHTML=`<div class="${errs.length?'badtext':'ok'}">${errs.length?errs.map(e=>'• '+e).join('<br>'):'✓ Structure valid · Net salary '+money(total(q))}</div>`;return[q,errs]}[m,b,h,a,d].forEach(el=>el.oninput=preview);preview();savePay.onclick=()=>{let[q,errs]=preview();if(errs.length)return;Object.assign(p,q,{updatedAt:new Date().toISOString(),updatedBy:current.name});save(x);closeModal();toastMsg('Salary structure updated and verified');payrollPage()}}
function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}modal.onclick=e=>{if(e.target===modal)closeModal()};function audit(){let errs=validateAll(db());if(errs.length)alert('Accuracy issues:\n'+errs.join('\n'));else toastMsg('Accuracy audit passed for all payroll records')}function toastMsg(s){toast.textContent=s;toast.classList.remove('hidden');setTimeout(()=>toast.classList.add('hidden'),2600)}
</script></body></html>
